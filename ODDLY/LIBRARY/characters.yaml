# ODDLY permanent character database. Approved designs must never change.
# `prompt` is the canonical description injected into every image prompt.
# `anim_lock` is the short on-model reminder injected into every animation prompt.

CHR_001:
  name: Milo
  type: human child (boy, 8)
  status: approved
  prompt: >-
    MILO, an 8-year-old boy, 4 heads tall with a big round head, small torso and stubby limbs;
    warm light-tan skin, messy chestnut-brown hair with one upright cowlick, big round dark-brown
    eyes with a white highlight, five freckles across the nose; mustard-yellow hoodie with a small
    white star patch on the left chest, navy shorts, white socks, red sneakers with white soles
  anim_lock: Milo - 4 heads tall, chestnut hair with single cowlick, mustard hoodie with white star patch, navy shorts, red sneakers
  palette: {skin: "#F2C9A0", hair: "#7A4A2A", eyes: "#3B2416", hoodie: "#E8B23A", star_patch: "#FFFFFF", shorts: "#2B3A67", sneakers: "#D9443A"}
  proportions: 4 heads tall; head width = shoulder width; hands are 4-finger cartoon hands.
  movement: Bouncy and quick with big anticipation and overshoot; tiptoes when sneaking; hair cowlick springs on every stop.
  expressions: [curious, wide-eyed gasp, giggle, scared, determined, sleepy, delighted, annoyed pout]
  reference_requirements: Turnaround (front, 3/4, side, back) on white; expression sheet of 8; pajama variant (light-blue pajamas with yellow moons) for night scenes.
  variants:
    PAJAMAS: light-blue pajamas with small yellow crescent moons replace the hoodie, shorts and sneakers; barefoot
  episodes: [EP008, EP009, EP010]

