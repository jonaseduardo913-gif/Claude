id: STYLE_ODDLY_V1
brand: ODDLY
tagline: A WORLD FULL OF SURPRISES.
version: 1.0
status: approved

image_style_prefix: >-
  Premium cinematic 2D cartoon animation still, professional animated series quality.
  Clean, consistent dark-brown (#2A1E1A) outlines of even medium weight on characters, thinner
  colored lines on backgrounds. Cel-shaded characters with one soft shadow tone and one rim light.
  Lush hand-painted illustrated background with soft gouache texture and atmospheric depth.
  Vibrant cinematic color with warm-cool contrast. Expressive, appealing character acting.
  Rounded, friendly shape language.

image_negative_prompt: >-
  text, letters, words, captions, subtitles, logos, watermark, signature, speech bubbles,
  photorealism, 3D render, CGI, anime style, chibi, extra fingers, extra limbs, missing limbs,
  deformed hands, inconsistent outlines, blurry, low resolution, jpeg artifacts, harsh noise,
  off-model character, different costume, different colors than reference, cropped heads,
  horror gore, scary realistic teeth.

animation_style_suffix: >-
  Smooth 2D cartoon animation at 24 fps, animated on ones for fast action and twos for
  holds. Squash-and-stretch, anticipation and overshoot on all major actions. Outlines stay
  stable and consistent between frames (no boiling, no morphing). Characters remain exactly
  on-model with the reference sheet. Background stays painted and stable except for listed
  environmental motion. No text appears. No lip-sync, no speech.

formats:
  SHORT:
    aspect_ratio: "9:16"
    resolution: 1080x1920
    fps: 24
    runtime_seconds: [35, 60]
    scene_count: [8, 12]
    safe_area: Keep faces and key action inside the central 1080x1420 band; bottom 300 px and top 200 px are covered by platform UI.
  LONG:
    aspect_ratio: "16:9"
    resolution: 1920x1080
    fps: 24
    runtime_seconds: [240, 480]
    scene_count: [40, 70]

color_rules:
  - Each episode has one dominant palette and one accent color listed in its manifest.
  - Night scenes are deep indigo/teal, never pure black; keep character silhouettes readable with rim light.
  - Characters always use their library hex colors; only lighting tints them.

storytelling_rules:
  - No narration, no dialogue, no lyrics, no readable text on screen (except the ODDLY end card).
  - The first 2 seconds must show the impossible thing immediately (the hook).
  - Every scene must read with the sound off; emotions are carried by acting, color and camera.
  - Endings land a visual twist in the final 6 seconds before the end card.

end_card:
  id: ENDCARD_STD
  duration: 2.0
  description: >-
    Deep indigo background (#1B1F4B). The ODDLY wordmark in rounded hand-drawn
    cream letters (#FFF3D6) pops in letter by letter with a bounce; the second D wobbles and
    a tiny star (#F6C21C) blinks out of it. Tagline "A WORLD FULL OF SURPRISES." fades in
    below in small caps.
  sound: Two-note celesta "ding-ding" rising, soft whoosh, tiny sparkle on the star blink. Same sting on every episode.
  note: Supply as a pre-rendered motion-graphics file; not AI-generated (contains text).

world:
  THISTLEDOWN: Hilly storybook village of crooked timber cottages, windmill, millpond and meadows, below Greystep Mountain. Home world of most ODDLY Shorts.
  BRASSPORT: Cozy brick port city with water towers, trams, laundromats, balconies and clotheslines.
