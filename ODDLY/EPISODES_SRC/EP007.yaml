id: EP007
concept: CON042
title: Canned Weather
format: SHORT
category: Impossible experiments
logline: On a scorching day, a sweaty office worker discovers a vending machine that sells weather in cans — and loses control of it.
palette: {dominant: "mint green #8FD9B6 and heat yellow #F7D046", accent: "rainbow spectrum"}

music:
  id: MUS_EP007
  title: Weather Report
  style: Jaunty small-band swing - brushed drums, walking upright bass, clarinet and vibraphone - with a distinct sting for each weather (sleigh bells for snow, timpani for thunder, theremin-like glass harmonica for fog, xylophone for hail), and a big band swell for the rainbow.
  bpm: 132
  key: C major
  instrumentation: [brushed drums, upright bass, clarinet, vibraphone, muted trumpet, sleigh bells, timpani, glass harmonica, xylophone, string section]
  rules: Each weather can that pops gets its own instrument sting on the exact pop frame.

scenes:
  - n: 1
    beat: HOOK
    dur: 3.0
    action: On a blazing hot street, sweaty Mr. Finch cracks open a can from a mint-green vending machine - and a private snowstorm erupts right above his head.
    chars: [CHR_005]
    bg: BG_012@HOT
    props: [PRP_008]
    fx: [FX_008, FX_011]
    shot: Medium shot of Mr. Finch beside the vending machine, a small swirling snow cloud above his head
    key: Mr. Finch holding an opened can, a fat little snow cloud swirling above his head dumping snowflakes on his slicked hair; heat haze and a melting ice-cream cone on the pavement behind him.
    lighting: Blinding midday sun, bleached colors, the snow cloud casting a cool blue patch of light
    motion: He pops the tab; a puff of white bursts out and blooms into a snow cloud above him; snow falls on his face; he blinks.
    camera: Static, slight push-in
    expressions: {CHR_005: sweaty exhausted, then shocked}
    sfx: [[0.0, "can tab crack and fizz"], [0.4, "whoomp of a cloud blooming"], [0.8, "sleigh bells sting"], [1.6, "soft snowfall swish"]]
    music: Swing band kicks in after the sleigh bells.
    transition: CUT

  - n: 2
    beat: TOO MUCH
    dur: 4.5
    action: Mr. Finch closes his eyes in bliss under his personal snowfall. The snow keeps coming until he's buried up to his neck in a snowdrift in the middle of the blazing street. A jogger runs past and stares.
    chars: [CHR_005, CHR_008]
    bg: BG_012@HOT
    fx: [FX_008]
    shot: Wide shot of the sidewalk, a perfect snowdrift with Mr. Finch's head sticking out, the jogger passing
    key: A tall snowdrift on the sun-baked sidewalk with only Mr. Finch's head poking out, blissful; the jogger in pink staring as she runs past.
    lighting: Blazing sun, the snowdrift sparkling
    motion: Snow piles up fast in a time-lapse; Mr. Finch's blissful face sinks until only his head shows; the jogger jogs past, turning her head 180 degrees to stare.
    camera: Slow pull-back revealing the drift
    expressions: {CHR_005: blissful, then realizing he is stuck, CHR_008: jogger baffled}
    sfx: [[0.0, "soft heavy snowfall"], [2.0, "snow crunch piling"], [2.8, "jogger footsteps"], [3.6, "puzzled jogger 'hm?' (non-verbal)"]]
    music: Swing groove light and bouncy.
    transition: CUT

  - n: 3
    beat: CURIOSITY
    dur: 4.0
    action: Mr. Finch digs himself out and studies the vending machine - rows of cans with tiny weather symbols. Curious, he feeds in coins and punches several buttons. The machine rattles and spits out a pile of cans.
    chars: [CHR_005]
    bg: BG_012@HOT
    props: [PRP_008]
    shot: Close-up on the vending machine glass with Mr. Finch's reflection, cans with weather symbols in rows
    key: Rows of colorful cans embossed with snowflake, cloud, lightning, sun and raindrop symbols behind glass; Mr. Finch's long finger pressing buttons.
    lighting: Hot sun glare on the glass
    motion: He presses buttons in a quick sequence; the machine shudders; three cans drop down one after another into the tray.
    camera: Static, small shakes with the machine
    expressions: {CHR_005: curious, greedy little smile}
    sfx: [[0.0, "snow shake-off 'fwff'"], [0.8, "coins clinking in"], [1.4, "button beeps x4"], [2.4, "machine rattle"], [3.0, "cans dropping 'clunk clunk clunk'"]]
    music: Vibraphone mischief riff.
    transition: CUT

  - n: 4
    beat: SPILL
    dur: 4.5
    action: He fumbles the armful of cans. They clatter on the pavement and roll away in every direction - into the café, under the bus and toward a wedding party.
    chars: [CHR_005]
    bg: BG_012@HOT
    props: [PRP_008]
    fx: [FX_005]
    shot: High-angle wide shot of the street corner, three cans rolling outward like a starburst from Mr. Finch
    key: Mr. Finch juggling and losing three cans; the cans rolling away in three directions toward the café, the bus stop and a wedding couple posing for a photo.
    lighting: Hot midday sun
    motion: Mr. Finch juggles, fails; the cans scatter in three rolling paths across the street; he reaches after them helplessly.
    camera: Top-down drift
    expressions: {CHR_005: panicked}
    sfx: [[0.0, "juggling fumble"], [1.0, "cans clattering on pavement"], [1.6, "three rolling tin rattles diverging"], [3.2, "rolling fading"]]
    music: Clarinet glissando down; the swing turns frantic.
    transition: CUT

  - n: 5
    beat: THUNDER
    dur: 4.0
    action: In the café, a can rolls against the espresso machine and pops - a small thundercloud bursts out, and a lightning bolt frizzes the barista's hair straight up.
    chars: [CHR_008]
    bg: BG_012@CHAOS
    props: [PRP_008]
    fx: [FX_009]
    shot: Medium shot inside the café doorway, the barista behind the counter
    key: A tiny black thundercloud over the espresso machine, a zig-zag lightning bolt striking down; the barista with her hair standing straight up in a frizzy puff, holding a cup.
    lighting: A white lightning flash on the café interior
    motion: The can pops; the thundercloud swells; a lightning bolt zaps; the barista's hair poofs up; she blinks and the coffee cup steams.
    camera: Static, flash frame on the zap
    expressions: {CHR_008: barista startled, then deadpan}
    sfx: [[0.0, "can pop"], [0.4, "timpani thunder roll"], [1.4, "electric zap CRACK"], [1.8, "hair poof 'fwump'"], [2.8, "coffee machine hiss"]]
    music: Timpani sting.
    transition: WHIP PAN

  - n: 6
    beat: FOG
    dur: 4.5
    action: Under the bus at the stop, a can pops. Thick fog fills the whole bus. It drives off honking inside its own little cloud.
    chars: [CHR_008]
    bg: BG_012@CHAOS
    props: [PRP_008]
    shot: Wide side shot of the bus at the stop
    key: A city bus completely filled with white fog pouring out of its windows, the driver's hat barely visible; the bus pulling away inside a cloud.
    lighting: Hot sun, fog glowing white
    motion: The can pops under the bus; fog billows up and fills every window; the bus honks and drives off slowly, trailing fog.
    camera: Pan following the bus
    expressions: {CHR_008: bus driver squinting through fog}
    sfx: [[0.0, "can pop"], [0.4, "eerie glass-harmonica fog sting"], [1.2, "fog hiss billowing"], [2.6, "muffled bus horn 'honk honk'"], [3.4, "bus engine pulling away"]]
    music: Glass harmonica sting, swing continues.
    transition: CUT

  - n: 7
    beat: HAIL
    dur: 4.5
    action: A bride and groom are posing for a photo when a can pops at their feet. A hailstorm pelts them; they huddle under her veil as tiny ice balls bounce everywhere.
    chars: [CHR_008]
    bg: BG_012@CHAOS
    props: [PRP_008]
    shot: Medium shot of the couple posing in front of a flower arch
    key: The bride and groom huddled under her lifted veil like an umbrella, tiny hailstones bouncing off it and off the pavement, flower petals flying.
    lighting: Hot sun with a gray hail cloud above them
    motion: The couple smiles for a photo; the can pops; a small gray cloud drops hail; they duck under the veil; hailstones bounce in rhythm.
    camera: Static, small shake on each bounce
    expressions: {CHR_008: bride and groom smiling, then shocked, huddling}
    sfx: [[0.0, "camera shutter click"], [0.6, "can pop"], [1.0, "xylophone hail sting"], [1.4, "hail pattering on fabric and pavement"]]
    music: Xylophone sting, then the swing returns.
    transition: CUT

  - n: 8
    beat: GUILT
    dur: 4.0
    action: Mr. Finch tiptoes away guiltily - then stops. On a balcony above, tiny Mrs. Pell sits gloomy beside a wilted geranium, a little gray rain cloud of her own drizzling over her head.
    chars: [CHR_005, CHR_006]
    bg: BG_012@CHAOS
    fx: [FX_007]
    shot: Low angle from Mr. Finch's position up to the balcony
    key: Mrs. Pell on her iron balcony slumped in a chair, a tiny gray rain cloud over her head, a wilted red geranium; Mr. Finch in the foreground mid-tiptoe looking up.
    lighting: Bright street, but the balcony in the shade of her little cloud
    motion: Mr. Finch tiptoes with elbows out, hears a sigh, looks up; Mrs. Pell sighs, her cloud drizzles a little harder.
    camera: Tilt up from Mr. Finch to the balcony
    expressions: {CHR_005: guilty, then tender, CHR_006: gloomy}
    sfx: [[0.0, "tiptoe squeaks"], [1.2, "small elderly sigh"], [1.8, "soft drizzle patter"], [3.0, "geranium petal falling 'tink'"]]
    music: Swing drops to a soft solo vibraphone.
    transition: CUT

  - n: 9
    beat: THE CHOICE
    dur: 5.0
    action: Mr. Finch walks back to the vending machine, puts in his very last coin and presses the sun button. The machine shakes violently, lights flashing.
    chars: [CHR_005]
    bg: BG_012@CHAOS
    props: [PRP_008]
    fx: [FX_003]
    shot: Medium shot of Mr. Finch at the machine, his last coin held up between two fingers
    key: Mr. Finch holding up a single coin, determined; his other finger on a button with a sun symbol; the machine's lights starting to flash.
    lighting: Warm light starting to glow out of the machine
    motion: He holds the coin up, inserts it, presses the sun button; the machine shudders, hops slightly, lights flash in sequence, a warm glow builds behind the dispensing flap.
    camera: Slow push-in, then shake
    expressions: {CHR_005: determined, then worried}
    sfx: [[0.0, "coin 'ting' held up"], [1.0, "coin slot 'clink'"], [1.6, "button beep"], [2.4, "rising machine rumble"], [3.6, "lights flicker buzz"]]
    music: Drum roll building.
    transition: CUT

  - n: 10
    beat: RAINBOW
    dur: 4.5
    action: A rainbow squeezes out of the coin slot - far too big. It unfurls like a giant ribbon up the street, sweeping away the fog, hail and snow, and arcs over to Mrs. Pell's balcony.
    chars: [CHR_005]
    bg: BG_012@RAINBOW
    fx: [FX_010, FX_001]
    shot: Wide street shot, the rainbow ribbon unrolling from the machine across the frame and up toward the balcony
    key: A thick glossy rainbow pouring out of the vending machine's slot and arching across the street; snow, fog and hail patches evaporating in sparkles; Mr. Finch knocked back holding his hat-less head.
    lighting: Rainbow light washing over the street
    motion: The rainbow squeezes out like toothpaste then springs out in a big unfurling arc; weather patches burst into sparkles as it passes; it arcs up and lands on the balcony.
    camera: Fast tilt and pan following the rainbow
    expressions: {CHR_005: astonished}
    sfx: [[0.0, "squeezing 'squeeeeek'"], [0.8, "spring 'SPROING'"], [1.2, "shimmering sweep"], [2.2, "weather patches popping into sparkles"], [3.6, "soft landing chime"]]
    music: Big-band swell, strings soaring.
    transition: CUT

  - n: 11
    beat: TWIST
    dur: 5.0
    action: The rainbow lands in Mrs. Pell's geranium pot - the flower bursts into bloom and her rain cloud evaporates. She laughs, hops on the rainbow and slides all the way down it like a playground slide, landing right in front of Mr. Finch, beaming.
    chars: [CHR_005, CHR_006]
    bg: BG_012@RAINBOW
    fx: [FX_010, FX_012]
    shot: Wide shot of the rainbow arc from balcony to street, Mrs. Pell sliding down it
    key: Tiny Mrs. Pell sliding down the rainbow with her arms up and pink slippers kicking, the geranium blooming on the balcony behind her; Mr. Finch at the bottom with his jaw dropped.
    lighting: Bright rainbow light, golden sun
    motion: The geranium bursts into red blooms; her cloud puffs away; she laughs, climbs onto the rainbow, and slides down in a long swoop, landing on her slippers in front of Mr. Finch and patting his cheek.
    camera: Follows her slide down, ends in a two-shot
    expressions: {CHR_006: delighted laugh, CHR_005: jaw-drop, then tender smile}
    sfx: [[0.0, "flower bloom 'pop-pop-pop'"], [0.8, "cloud puff away"], [1.4, "elderly laugh (non-verbal)"], [2.0, "long slide-whistle swoop down"], [3.8, "soft slipper landing"], [4.4, "cheek pat"]]
    music: Swing finale with a clarinet run that follows her slide, final C major chord at the cut.
    transition: CUT TO END CARD

