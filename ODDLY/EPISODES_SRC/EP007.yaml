edit:
  grade: Sun-bleached hot yellow-white palette (SC1-4), each weather gag gets its own color pocket (blue snow, white flash, gray fog, gray hail), then a saturated rainbow grade for SC10-11.
  mix_notes: Every can pop must land with its weather sting on the same frame; the swing band ducks under each.
  notes:
    - SC5 includes a 2-frame white flash on the lightning strike.
    - SC5 to SC6 whip pan carries the eye from café to bus.
    - The rainbow must clearly come out of the coin slot in SC10 - that's the joke.

qc:
  character_consistency: Mr. Finch is hat-less throughout (the 'hat' gags use his slicked hair); Mrs. Pell's cardigan stays buttoned wrong; citizens come from the CHR_008 pack.
  story_originality: Weather-in-a-can misfires leading to an act of kindness; unique in the slate.
  scene_continuity: Background variant moves HOT -> CHAOS (after cans spread) -> RAINBOW (after SC10); one snow can bought first, then three cans released for three gags (thunder, fog, hail), then the sun can.
  visual_quality: Signature frames - snow cloud over head (SC1), snowdrift (SC2), lightning hair (SC5), fog bus (SC6), rainbow from the coin slot (SC10), rainbow slide (SC11).
  animation_feasibility: One street set with variants; each gag is a single-location shot.
  pacing: Gag every 4-4.5s; emotional turn at 33s; payoff in the last 9.5s.
  sound_sync: A unique instrument sting per weather type on the pop frame.
  strong_opening: A snowstorm over one man's head on a blazing day.
  memorable_ending: A grandmother sliding down a rainbow.
