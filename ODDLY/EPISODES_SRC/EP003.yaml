edit:
  grade: Bright saturated summer palette throughout; warm amber sunset grade only on SC5; hive interior glowing amber.
  mix_notes: Every wrong flight sound must be mixed 3 dB above everything else and perfectly synced to the wingbeat frame. This episode is sound-led - check sync frame by frame.
  notes:
    - SC1 starts on the launch, honk on frame 7.
    - SC6 contains three attempts; if needed split into 3 inserts of 1.6s each with the same background.
    - SC7 roll the image from upside down to right-side up over 12 frames.
    - The finale orchestra must be in strict time with the music; sync wing sounds to beats.

qc:
  character_consistency: Bix keeps its size and stripe pattern; guard bee always wears the acorn-cap helmet.
  story_originality: Sound-swap comedy built for a dialogue-free format; unique in the slate.
  scene_continuity: The honey jar is seen near the hive (SC7) before it is used in the finale (SC11). Sunset in SC5 is a short dissolve beat; the following scenes return to daylight as the next morning.
  visual_quality: Signature frames - honk takeoff (SC1), guard rejection (SC4), dandelion sigh (SC5), hive orchestra (SC11).
  animation_feasibility: Macro sets with one hero and a reusable bee crowd; sound-shape bursts are simple 2D overlays.
  pacing: Gag every 3-5s; low point at 16.5s; discovery at 25.5s; finale in the last 5s.
  sound_sync: Each wingbeat sound is listed at an exact time; music leaves gaps for them.
  strong_opening: Bike-horn honk on the first wingbeat.
  memorable_ending: The whole hive turns the silly sounds into an orchestra.
