edit:
  grade: Festival warm golds on deep teal (SC1-3, SC9); storm violet and near-black (SC5-8) with Glim as the only light source in SC6-8; clean starry blues with white-gold accents in SC10-11.
  mix_notes: In SC8, pull the storm down so the music-box motif and footsteps carry the scene.
  notes:
    - SC6 and SC8 must stay genuinely dark - do not brighten them in grading; Glim's glow must be the key light.
    - CHR_030 switches to its STAR variant from SC10 onward only.
    - Hold the final twinkle 8 frames before the end card.

qc:
  character_consistency: Milo and June are reused from the library; Glim dim (SC1-9) and STAR variant (SC10-11) only.
  story_originality: The dimmest firefly is secretly a baby star; distinct from EP004's bread-star twist (different conflict, emotional rather than comic). The two endings are scheduled far apart in the release order.
  scene_continuity: Lanterns lit (SC2) -> out (SC5) -> relit (SC9); storm starts SC5, clears SC9.
  visual_quality: Signature frames - firefly wave (SC1), dark lantern (SC2), lone light in the storm (SC8), rising star (SC10).
  animation_feasibility: Glow particles reused; dark scenes are cheap to render.
  pacing: Rejection by 7.5s, storm at 16.5s, brave choice at 25.5s, rescue 29.5s, twist last 5s.
  sound_sync: The music-box motif carries the emotion and survives the storm.
  strong_opening: A wave of thousands of fireflies with one failing light.
  memorable_ending: The firefly becomes a star and twinkles back.
