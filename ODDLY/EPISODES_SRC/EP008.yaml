id: EP008
concept: CON023
title: The Dimmest Firefly
format: SHORT
category: Emotional adventures
logline: At Thistledown's lantern festival, the firefly with the weakest glow is the only one brave enough to guide two lost children home through a storm.
palette: {dominant: "midnight teal #14324A and firefly gold-green #C8F25A", accent: "star white #FFF1C2"}

music:
  id: MUS_EP008
  title: Little Light
  style: Festive village folk (fiddle, flute, frame drum, accordion) that falls into a fragile music-box motif for Glim; a dark storm of low strings and thunder; a rising wordless choir pad and glockenspiel for the transformation.
  bpm: 108 (festival), 70 (Glim and storm)
  key: D major -> B minor -> D major
  instrumentation: [fiddle, flute, accordion, frame drum, music box, low strings, timpani, wordless choir pad (no lyrics), glockenspiel, harp]
  rules: Glim's music-box motif is three notes; it is the only melody heard during the storm.

scenes:
  - n: 1
    beat: HOOK
    dur: 3.0
    action: Over the night meadow, thousands of fireflies rise in a glowing golden-green wave. Among them, one tiny speck barely flickers.
    chars: [CHR_031, CHR_030]
    bg: BG_002@NIGHT
    fx: [FX_004]
    shot: Wide low shot of the meadow, a wave of glowing fireflies rising into the sky; one faint speck in the foreground in sharp focus
    key: A river of bright golden-green lights sweeping upward over the grass; in the foreground, Glim with its faint pale tail glow, eyes looking up at the others.
    lighting: Deep teal night lit by thousands of warm glows; Glim lit only by its own faint light
    motion: The swarm rises in a sweeping wave; Glim tries to rise with them, flickers weakly, and lags behind.
    camera: Slow tilt up with the swarm, then rack focus to Glim
    expressions: {CHR_030: hopeful, then shy}
    sfx: [[0.0, "rising shimmer of many tiny wings"], [1.4, "airy whoosh of the swarm"], [2.2, "single faint flicker 'tik… tik'"]]
    music: Festival fiddle tune starts loud, then drops to Glim's music-box motif.
    transition: CUT

  - n: 2
    beat: REJECTED
    dur: 4.5
    action: Villagers hang paper lanterns and fireflies fly inside to light them. Glim flies into a lantern, but it stays dark. A bright firefly flies in, lights it up, and shoos Glim out.
    chars: [CHR_030, CHR_031, CHR_007]
    bg: BG_002@NIGHT
    props: [PRP_013]
    shot: Medium shot of a row of paper lanterns on poles, one dark lantern in the middle
    key: A row of glowing paper lanterns with one dark lantern; Glim faintly visible inside it; a bright firefly arriving; villagers in soft focus behind.
    lighting: Warm lantern glows, one dark gap
    motion: Glim enters the lantern; it glows barely at all; a bright firefly zooms in and the lantern blazes; the bright firefly nudges Glim out with a flick.
    camera: Static, slight push-in on the dark lantern
    expressions: {CHR_030: hopeful, then ashamed, CHR_031: proud, dismissive, CHR_007: happy villagers in background}
    sfx: [[0.0, "festival crowd murmur (no words)"], [1.0, "tiny paper rustle"], [2.4, "lantern lights 'fwoom'"], [3.2, "little flick 'tk'"]]
    music: Festival tune continues in the background, slightly muffled.
    transition: CUT

  - n: 3
    beat: ASHAMED
    dur: 4.0
    action: Glim drifts away from the festival and sits alone on a blade of grass at the edge of the dark. Its glow dims even more.
    chars: [CHR_030]
    bg: BG_002@NIGHT
    shot: Close-up of Glim on a bending blade of grass, the bright festival blurred far behind
    key: Glim sitting on a curved grass blade, hunched, tail glow almost out; the festival a warm bokeh far behind.
    lighting: Cold teal moonlight, faint warm bokeh behind
    motion: Glim lands, the blade bends; Glim hugs itself; its glow fades to almost nothing.
    camera: Slow push-in
    expressions: {CHR_030: ashamed, lonely}
    sfx: [[0.0, "distant festival music"], [1.4, "grass blade creak"], [2.6, "tiny sigh"]]
    music: Music-box motif alone, slow.
    transition: CUT

  - n: 4
    beat: THE KIDS
    dur: 4.5
    action: Milo and June chase each other away from the festival and run, laughing, into the tall dark grass of Firefly Hollow beyond the lanterns.
    chars: [CHR_001, CHR_002]
    bg: BG_016@CLEAR_NIGHT
    shot: Wide shot from inside the dark field looking back toward the festival, the kids running toward camera
    key: Milo and June running and laughing into tall grass, the festival lanterns behind them getting smaller; birch trees on the edges.
    lighting: Dim moonlight, warm glow behind them
    motion: June chases Milo through the grass; they dart past camera into the darkness; the grass closes behind them.
    camera: Static, then whip as they pass
    expressions: {CHR_001: giggling, CHR_002: laughing}
    sfx: [[0.0, "running footsteps in grass"], [1.2, "children's giggles (non-verbal)"], [3.0, "grass swishing closed"]]
    music: A playful fiddle phrase, then thunder rumbles underneath.
    transition: CUT

  - n: 5
    beat: STORM
    dur: 4.5
    action: A storm sweeps in. Wind blows out every lantern. The bright fireflies panic and hide under a cottage eave. The festival goes dark.
    chars: [CHR_031, CHR_007]
    bg: BG_002@STORM
    props: [PRP_013]
    fx: [FX_007, FX_009]
    shot: Wide shot of the festival in the storm
    key: Paper lanterns swinging wildly and going dark; a cluster of bright fireflies huddling under a roof eave; villagers holding their hats.
    lighting: Violet storm light, lightning flash, lanterns blinking out
    motion: A gust swings the lanterns; they go out one by one; the bright fireflies swarm under an eave; a lightning flash.
    camera: Shake on the gust, flash frame
    expressions: {CHR_031: scared, CHR_007: worried villagers holding their hats}
    sfx: [[0.0, "howling wind gust"], [1.0, "lanterns snuffing out 'fff fff fff'"], [2.4, "thunder crack"], [3.4, "rain starting"]]
    music: Low strings and timpani storm.
    transition: CUT

  - n: 6
    beat: LOST
    dur: 4.5
    action: Deep in Firefly Hollow, Milo and June are lost in the pitch-dark storm, holding hands, unable to see the path home.
    chars: [CHR_001, CHR_002]
    bg: BG_016@STORM_NIGHT
    fx: [FX_007]
    shot: Medium shot of the kids huddled together in the whipping grass
    key: Milo and June holding hands in the dark rain, hair and raincoat blown sideways, looking in different directions, barely lit.
    lighting: Almost pitch black, only faint shapes; a brief lightning flash reveals them
    motion: The kids turn in place looking for the way; a lightning flash shows them; then darkness again; Milo squeezes June's hand.
    camera: Slow circle around them
    expressions: {CHR_001: scared, CHR_002: worried but brave}
    sfx: [[0.0, "rain and wind in tall grass"], [1.6, "lightning crack"], [2.4, "frightened breath (non-verbal)"], [3.6, "distant thunder"]]
    music: Storm strings, very low.
    transition: CUT

  - n: 7
    beat: BRAVERY
    dur: 4.0
    action: Under the cottage eave, the bright fireflies cower. Glim sees the dark field, trembles, then flies out alone into the storm.
    chars: [CHR_030, CHR_031]
    bg: BG_002@STORM
    fx: [FX_007]
    shot: Close shot under the eave, bright fireflies huddled, Glim at the edge facing the storm
    key: Glim at the edge of the eave facing the rain, the bright fireflies cowering behind it.
    lighting: Bright huddle glow behind, dark storm ahead
    motion: Glim looks at the storm, trembles, takes a breath, and flies out into the rain, buffeted but steady.
    camera: Starts behind Glim, follows it out into the rain
    expressions: {CHR_030: scared, then brave, CHR_031: scared}
    sfx: [[0.0, "rain on roof tiles"], [1.4, "tiny determined breath"], [2.2, "tiny wings into wind"], [3.2, "raindrop near-misses 'plip plip'"]]
    music: Glim's music-box motif plays bravely over the storm.
    transition: CUT

  - n: 8
    beat: THE LIGHT
    dur: 5.0
    action: In the total darkness of the hollow, Glim's faint glow is the only light - and in pitch black, it's enough. The kids see it. Glim flickers ahead, and they follow it along the path.
    chars: [CHR_030, CHR_001, CHR_002]
    bg: BG_016@STORM_NIGHT
    fx: [FX_004]
    shot: Wide shot of the dark field, a single small pale light leading two small silhouettes along a winding path
    key: Glim's small pale glow in the middle of a black field, lighting a short stretch of the path; Milo and June following hand in hand, faces faintly lit.
    lighting: Complete darkness except for Glim's soft pale glow on the kids' faces
    motion: Glim hovers in front of the kids; they notice and point; Glim moves forward, pauses, waits; they follow step by step along the path.
    camera: Slow tracking shot alongside
    expressions: {CHR_030: brave, focused, CHR_001: hopeful, CHR_002: awed}
    sfx: [[0.0, "rain softening"], [1.2, "small gasp of relief"], [2.4, "footsteps on wet path"], [3.6, "gentle chime each time Glim pauses"]]
    music: Music-box motif joined by harp; the storm strings fade.
    transition: CUT

  - n: 9
    beat: HOME
    dur: 4.5
    action: The kids step out of the grass at the edge of the village as the storm clears. Villagers relight the lanterns. The mother in the mustard shawl hugs them; Milo and June point back at Glim.
    chars: [CHR_001, CHR_002, CHR_007, CHR_030]
    bg: BG_002@NIGHT
    props: [PRP_013]
    shot: Medium-wide shot at the festival edge
    key: The mother in the mustard shawl kneeling to hug Milo and June; lanterns glowing again; both kids pointing up at tiny Glim hovering above.
    lighting: Lanterns relit, warm, clouds parting overhead
    motion: The kids run into the hug; lanterns relight one by one; the kids point up; villagers look up at Glim.
    camera: Slow push-in
    expressions: {CHR_001: relieved, CHR_002: grateful, pointing, CHR_007: relieved, CHR_030: shy}
    sfx: [[0.0, "rain stopping, drips"], [1.0, "lanterns relighting 'fwoom fwoom'"], [2.0, "warm crowd 'ahh' (non-verbal)"], [3.2, "soft cloth hug"]]
    music: Festival fiddle returns softly, slowed and warm.
    transition: CUT

  - n: 10
    beat: RISING
    dur: 4.5
    action: Glim begins to rise, higher and higher above the festival, and its glow grows brighter and whiter with every second.
    chars: ["CHR_030:STAR", CHR_031]
    bg: BG_007@NIGHT
    fx: [FX_004, FX_001]
    shot: Low wide shot from the festival up into the clearing night sky, Glim rising
    key: Glim rising into the sky, its light now a radiant white-gold with soft rays, the bright fireflies below looking up in astonishment.
    lighting: Clear starry sky; Glim's glow becoming the brightest thing in frame
    motion: Glim ascends steadily; its glow swells from pale green to white-gold; the bright fireflies below gather and stare up.
    camera: Slow tilt up following Glim
    expressions: {CHR_030: serene, CHR_031: amazed}
    sfx: [[0.0, "rising shimmer"], [1.8, "glow swell hum"], [3.2, "glockenspiel sparkle"]]
    music: Wordless choir pad rises, glockenspiel.
    transition: CUT

  - n: 11
    beat: TWIST
    dur: 5.0
    action: Glim settles into a gap among the stars - it was never a firefly at all, but a baby star. It twinkles. Far below, Milo and June wave, and the new star twinkles back.
    chars: ["CHR_030:STAR", CHR_001, CHR_002]
    bg: BG_007@NIGHT
    fx: [FX_001, FX_004]
    shot: Wide shot of the night sky above Thistledown rooftops, the new star among the others, two tiny kids waving from a hill in the corner
    key: The night sky over the rooftops, a new bright white-gold star settling into a gap in a constellation; Milo and June small on the hill below, waving.
    lighting: Starlight, festival glow on the horizon
    motion: Glim drifts into the gap and becomes a twinkling star; the kids wave; the star twinkles twice in answer.
    camera: Slow pull-back revealing the whole sky
    expressions: {CHR_030: serene, CHR_001: waving happily, CHR_002: waving happily}
    sfx: [[0.0, "airy celestial hush"], [1.6, "star settling chime"], [3.0, "twinkle"], [3.6, "twinkle"]]
    music: Glim's three-note motif played big by the full ensemble; final D major chord at the cut.
    transition: CUT TO END CARD

