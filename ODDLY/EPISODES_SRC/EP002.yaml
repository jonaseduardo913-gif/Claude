edit:
  grade: Warm golden afternoon (SC1-6), purple dusk (SC7), cool blue pre-dawn (SC8-9), blazing gold sunrise (SC10-11). Keep the shift gradual; the sunrise should be the brightest frame in the episode.
  mix_notes: The music stops are the comedy - cut music to true silence (room tone only) for each stop; restart on beat.
  notes:
    - SC4 hold the mid-air freeze for a full 36 frames before the drop; do not shorten.
    - SC6 is shown fully upside down; roll the image 180 degrees in the edit if the generated clip is right-side up.
    - SC7 contains three glance beats; if the generator returns one pose, split into three 1.5s inserts using the library boulder positions.
    - End on Hazel's grin; cut to end card on the final chord.

qc:
  character_consistency: Hazel and the hero Stonekin (smile crack, yellow lichen) are visually distinguishable from crowd Stonekin in SC8-11.
  story_originality: Musical-statues mechanic with a living boulder; conflict and twist are unique in the slate.
  scene_continuity: Time of day progresses afternoon -> dusk -> pre-dawn -> sunrise; tin mug introduced SC2 and returns SC11.
  visual_quality: Signature frames - mid-air freeze (SC4), upside-down POV (SC6), row of boulders (SC8), sunrise (SC10).
  animation_feasibility: Stonekin are simple spheres with eyes; the crowd is duplicated with only lichen and size changes.
  pacing: Gag escalation every 4-5s; emotional turn at 34s; twist in last 4.5s.
  sound_sync: Music stops synced to every turnaround (SC2, SC4, SC6, SC7); stone hum lands with the light sweep.
  strong_opening: A boulder rolling uphill in frame 1.
  memorable_ending: The game reverses - the boulder peeks at Hazel.
