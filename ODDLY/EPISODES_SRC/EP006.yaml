edit:
  grade: Warm sunset palette throughout, cooling to violet at SC5-6, then golden-pink tropical warmth on the island.
  mix_notes: Fabric-flap SFX are soft; keep the flock flaps rhythmic and in tempo with the music.
  notes:
    - SC1 begins on the dryer door pop - no lead-in.
    - SC8 to SC9 dissolve over 12 frames to cover the long sea crossing.
    - The pink heart darn must be clearly visible in SC11; push in if needed.

qc:
  character_consistency: Stripe and its pair share the identical design, distinguished only by the pink heart darn; the pigeon is consistent across SC5-8.
  story_originality: Socks as migratory birds; unique premise.
  scene_continuity: Same evening throughout - laundromat dusk -> rooftop dusk -> sea -> island sunset (moving south and west keeps the sun up).
  visual_quality: Signature frames - dryer launch (SC1), clothesline snag (SC4), sock scarf on a pigeon (SC7), sock island (SC9), sock ball (SC11).
  animation_feasibility: Socks are simple ribbon shapes; the flock reuses one undulation cycle with offsets.
  pacing: Loss at 3s, journey 7.5-34s, arrival 34s, lonely beat 39s, twist last 5s.
  sound_sync: Flock theme reserved for SC1 and SC8 to mark loss and return.
  strong_opening: Socks flying out of a dryer in formation.
  memorable_ending: Stripe finds its matching pair and they roll into a sock ball.
