id: EP009
concept: CON039
title: Ocean in a Jar
format: SHORT
category: Impossible experiments
logline: A jar of seawater on Milo's desk has its own waves, its own weather and a tiny ship in trouble — and Milo has to calm the storm without shaking the jar.
palette: {dominant: "ocean blue #2F6DB5 and storm gray #4A5263", accent: "ship red #C8392F"}

music:
  id: MUS_EP009
  title: Jar Shanty
  style: A sea-shanty-flavored instrumental (concertina, fiddle, bodhran) in miniature, sounding slightly 'tiny' and boxy when we are inside the jar; storm strings and timpani; a calm lullaby; a deep mysterious low-brass chord for the final pullback.
  bpm: 104
  key: D minor -> D major -> ambiguous low brass
  instrumentation: [concertina, fiddle, bodhran, pizzicato strings, timpani, celesta, harp, low brass, tam-tam]
  rules: Music inside the jar is filtered (band-passed) to sound small; outside the jar it is full range.

scenes:
  - n: 1
    beat: HOOK
    dur: 3.0
    action: At night, a glass jar on Milo's desk holds a raging thunderstorm. Lightning inside the jar flashes, lighting up the whole dark bedroom. Milo sits bolt upright in bed.
    chars: ["CHR_001:PAJAMAS"]
    bg: BG_013@NIGHT
    props: [PRP_009]
    fx: [FX_009]
    shot: Wide shot of the dark bedroom, the glowing jar on the desk in the foreground, Milo in bed behind it
    key: A mason jar on the desk with tiny black storm clouds and a tiny lightning bolt inside, throwing white light across the room; Milo sitting up in bed, eyes wide.
    lighting: Dark blue moonlit room, lit by sharp white flashes from inside the jar
    motion: Tiny lightning flickers inside the jar twice, strobing the room; on the second flash, Milo pops upright in bed.
    camera: Static
    expressions: {CHR_001: wide-eyed gasp}
    sfx: [[0.0, "small muffled thunder from inside glass"], [0.8, "tiny lightning crackle"], [1.6, "glass vibrating hum"], [2.2, "bed springs as Milo sits up"]]
    music: Filtered timpani roll from inside the jar.
    transition: CUT

  - n: 2
    beat: DISCOVERY
    dur: 4.5
    action: Milo tiptoes to the desk and presses his nose to the glass. Inside, a tiny sailing ship is being tossed on giant waves.
    chars: ["CHR_001:PAJAMAS"]
    bg: BG_013@NIGHT
    props: [PRP_009, PRP_010]
    shot: Close-up, Milo's face pressed to the curved glass, the tiny ship in the waves between us and him
    key: Milo's huge face distorted by the curved glass, nose squashed, eyes wide; in the foreground inside the jar, a tiny red-striped ship tilting on a wave.
    lighting: Storm light inside the jar on Milo's face
    motion: Milo tiptoes in, leans close, nose squashes on the glass; the tiny ship rises up a wave and slides down.
    camera: Slow push-in through the glass
    expressions: {CHR_001: curious, then worried}
    sfx: [[0.0, "creaky tiptoe on wooden floor"], [1.6, "nose squeak on glass"], [2.4, "tiny waves crashing (filtered)"], [3.4, "tiny ship timbers creaking"]]
    music: Concertina shanty motif, filtered small.
    transition: ZOOM THROUGH

  - n: 3
    beat: INSIDE
    dur: 4.0
    action: Inside the jar, Captain Tot clings to the ship's wheel as a huge wave rises. Beyond the curved glass, Milo's giant eye looms like a moon.
    chars: [CHR_032, "CHR_001:PAJAMAS"]
    bg: BG_014@STORM
    props: [PRP_010]
    fx: [FX_007, FX_009]
    shot: Macro shot on the tiny deck, Captain Tot at the wheel, a giant wave behind, Milo's huge eye beyond the glass wall
    key: Captain Tot gripping the wheel with his beard blown sideways, a towering foaming wave behind the ship, and through the curved glass a gigantic brown eye with a white highlight watching.
    lighting: Stormy gray with lightning flashes
    motion: The wave rises; Captain Tot spins the wheel; the ship climbs the wave face; lightning flashes revealing the giant eye blinking.
    camera: Handheld rocking with the ship
    expressions: {CHR_032: stormy determination, then terrified as he notices the eye, CHR_001: worried eye}
    sfx: [[0.0, "roaring tiny storm (full range now)"], [1.0, "wheel spinning clatter"], [2.2, "huge wave rumble"], [3.2, "giant eye blink 'whum'"]]
    music: Shanty in the storm - fiddle and bodhran, urgent.
    transition: CUT

  - n: 4
    beat: MISTAKE
    dur: 4.5
    action: Milo panics and grabs the jar to help - the water sloshes and inside the waves grow even bigger. He freezes with his hands on the glass.
    chars: ["CHR_001:PAJAMAS"]
    bg: BG_013@NIGHT
    props: [PRP_009, PRP_010]
    shot: Medium shot of Milo at the desk holding the jar with both hands
    key: Milo gripping the jar, water sloshing high up the inside, the tiny ship flung sideways, Milo's face frozen in horror.
    lighting: Storm flashes
    motion: Milo grabs the jar; the water sloshes violently; a huge wave inside nearly flips the ship; Milo freezes, slowly lifts his hands away one finger at a time.
    camera: Snap zoom on the slosh, then hold
    expressions: {CHR_001: scared, then frozen with horror}
    sfx: [[0.0, "glass grab squeak"], [0.6, "big slosh"], [1.4, "tiny ship crash and creak"], [2.6, "tense silence"], [3.4, "fingers peeling off glass, one squeak each"]]
    music: Music stops on the slosh.
    transition: CUT

  - n: 5
    beat: LIGHTHOUSE
    dur: 4.0
    action: Milo grabs his mushroom-shaped nightlight and holds it against the glass like a lighthouse. Inside, Captain Tot sees the warm beam and steers toward it.
    chars: ["CHR_001:PAJAMAS", CHR_032]
    bg: BG_013@NIGHT
    props: [PRP_009, PRP_010]
    shot: Side shot of the jar with the glowing nightlight pressed against the glass, the beam crossing the tiny sea
    key: The mushroom-shaped nightlight glowing warm against the jar, its light beaming across the tiny stormy sea like a lighthouse; the tiny ship turning toward it.
    lighting: Warm yellow beam cutting through gray storm light
    motion: Milo places the nightlight against the glass; its light beams across the water; Captain Tot spots it and spins the wheel; the ship turns toward the light.
    camera: Slow push toward the jar
    expressions: {CHR_001: determined, CHR_032: relieved, steering}
    sfx: [[0.0, "nightlight click"], [0.8, "warm light hum"], [2.0, "wheel spin clatter"], [3.0, "tiny foghorn 'toot'"]]
    music: Concertina plays a hopeful phrase.
    transition: CUT

  - n: 6
    beat: STILL STORMING
    dur: 4.5
    action: But the storm keeps raging. A tiny lightning bolt strikes the water right beside the ship's mast. Milo winces.
    chars: [CHR_032, "CHR_001:PAJAMAS"]
    bg: BG_014@STORM
    props: [PRP_010]
    fx: [FX_009, FX_007]
    shot: Macro shot on the ship from water level, lightning striking right next to the mast, Milo's wincing face huge behind the glass
    key: A tiny jagged lightning bolt hitting the water inches from the mast with a white flash; Captain Tot ducking; Milo's giant face behind the glass, wincing.
    lighting: White lightning flash, gray storm
    motion: Lightning strikes; spray explodes; Captain Tot ducks; the ship rocks; Milo winces behind the glass.
    camera: Shake on the strike
    expressions: {CHR_032: terrified duck, CHR_001: wincing}
    sfx: [[0.0, "tiny lightning CRACK"], [0.4, "spray explosion"], [1.6, "ship rocking creaks"], [3.0, "Milo's wince 'eek' (non-verbal)"]]
    music: Timpani hit, storm strings.
    transition: CUT

  - n: 7
    beat: THE IDEA
    dur: 4.0
    action: Milo takes a slow, deep breath and gently breathes on the glass. A soft patch of fog blooms on it - and inside, a warm breeze begins to push the storm clouds apart.
    chars: ["CHR_001:PAJAMAS"]
    bg: BG_013@NIGHT
    props: [PRP_009]
    shot: Close-up profile of Milo breathing gently onto the jar
    key: Milo with cheeks softly puffed, lips rounded, a gentle cloud of breath fogging the glass; inside the jar, clouds starting to swirl apart.
    lighting: Moonlight and soft storm glow
    motion: Milo inhales slowly, exhales gently; fog spreads on the glass; inside, the clouds begin to drift apart in a spiral.
    camera: Slow push-in
    expressions: {CHR_001: calm, concentrating}
    sfx: [[0.0, "slow deep inhale"], [1.4, "long gentle 'hhhhhaaaa' breath"], [2.4, "glass fogging hiss"], [3.2, "tiny wind turning gentle"]]
    music: Harp glissando, the storm strings fade.
    transition: CUT

  - n: 8
    beat: CALM
    dur: 5.0
    action: Inside the jar, the clouds part, a tiny sun comes out, and the waves settle into gentle sparkles. Captain Tot slumps with relief, then stands up straight and salutes Milo.
    chars: [CHR_032]
    bg: BG_014@CALM
    props: [PRP_010]
    fx: [FX_001]
    shot: Macro shot of the ship on calm sparkling water, a tiny sun in a tiny blue sky, the curved glass wall around
    key: The tiny ship on gentle glittering waves, Captain Tot standing at the rail saluting with a big smile, a tiny bright sun overhead.
    lighting: Warm tiny sunlight, sparkles on the water
    motion: Clouds slide away; sunlight sweeps across; waves smooth out; Captain Tot slumps, wipes his brow, straightens up, and salutes toward camera.
    camera: Slow pull-back to show the calm sea
    expressions: {CHR_032: relieved, then saluting smile}
    sfx: [[0.0, "clouds parting whoosh"], [1.2, "gentle lapping waves (filtered)"], [2.4, "tiny seagull peep"], [3.8, "tiny heel click of the salute"]]
    music: The shanty returns as a calm, happy lullaby.
    transition: CUT

  - n: 9
    beat: GOODNIGHT
    dur: 4.5
    action: Milo salutes back with a big grin. He moves the jar to the window sill where the moon shines in, and climbs back into bed.
    chars: ["CHR_001:PAJAMAS"]
    bg: BG_013@NIGHT
    props: [PRP_009]
    shot: Medium-wide shot of the bedroom, the jar on the round window sill glowing softly, Milo climbing into bed
    key: The jar glowing a calm blue on the window sill in the moonlight; Milo in bed pulling up the navy star quilt, smiling at it.
    lighting: Calm moonlight, soft blue glow from the jar
    motion: Milo salutes, carries the jar carefully to the sill, climbs into bed, pulls up the quilt and smiles at the jar.
    camera: Static
    expressions: {CHR_001: delighted, then sleepy}
    sfx: [[0.0, "small salute 'swish'"], [1.0, "careful footsteps"], [2.2, "jar set on sill 'tok'"], [3.2, "quilt rustle and bed creak"]]
    music: Celesta lullaby.
    transition: CUT

  - n: 10
    beat: THE SPYGLASS
    dur: 4.5
    action: Inside the jar, Captain Tot raises his brass spyglass and looks up past Milo, toward the round window - and his eyes go wide at something far beyond it.
    chars: [CHR_032]
    bg: BG_014@CALM
    props: [PRP_010]
    shot: Low macro shot looking up at Captain Tot raising his spyglass toward the sky beyond the glass
    key: Captain Tot looking up through his spyglass with his free eye popping wide in astonishment, the curved glass and the bedroom window blurred above him.
    lighting: Soft moonlight through the glass
    motion: Captain Tot extends the spyglass with a click, looks up, adjusts focus, and freezes; his visible eye goes huge; his beard bristles.
    camera: Slow tilt up past the spyglass toward the window
    expressions: {CHR_032: curious, then astonished}
    sfx: [[0.0, "spyglass extending 'clik-clik-clik'"], [1.6, "focus twist squeak"], [3.0, "astonished tiny gasp"]]
    music: The lullaby stops; one deep low-brass note.
    transition: CUT

  - n: 11
    beat: TWIST
    dur: 5.0
    action: The camera pulls back out through Milo's round window and keeps going - Milo's whole attic room is inside a glass jar, sitting on an enormous desk. A giant breath gently fogs the outside of that jar.
    chars: []
    bg: BG_015@NIGHT
    fx: [FX_004]
    shot: Extreme pullback ending in a wide shot of a giant wooden desk with one big glass jar containing a whole attic bedroom
    key: A huge glass jar on a giant desk, inside it a complete attic bedroom with a round window glowing; a giant desk lamp and giant pencils beside it; a soft patch of fog spreading on the jar's glass from a breath out of frame.
    lighting: Warm lamp light in a vast dim room
    motion: Continuous pull-back out of the window, through the glass of a bigger jar, revealing the giant desk; a soft fog patch blooms on the outer jar's glass, mirroring Milo's breath.
    camera: Fast smooth pull-back, decelerating to a stop
    expressions: {}
    sfx: [[0.0, "airy whoosh of the pull-back"], [2.4, "giant room tone, deep and quiet"], [3.4, "enormous slow gentle breath"], [4.2, "low glass resonance"]]
    music: Deep mysterious low-brass chord swells with a soft tam-tam, held to the cut.
    transition: CUT TO END CARD

