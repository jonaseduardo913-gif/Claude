edit:
  grade: Night blue bedroom with cold white storm flashes (SC1-7); warm tiny-sun glow inside the jar (SC8); calm moonlight (SC9-10); warm amber lamp light and deep shadows in the giant room (SC11).
  mix_notes: Apply a band-pass filter to all sound inside the jar when seen from outside; open it to full range in macro interior shots (SC3, SC6, SC8, SC10).
  notes:
    - SC2 to SC3 ZOOM THROUGH - push through the glass into the macro world.
    - SC11 is one continuous pull-back; if generated in pieces, stitch with hidden cuts at the window frame and jar glass.
    - Do not show the giant in SC11 - only the breath fog.

qc:
  character_consistency: Milo is in the PAJAMAS variant throughout; Captain Tot keeps his spyglass, which pays off in SC10.
  story_originality: A tiny storm calmed by breath, with a recursive scale-reveal ending; EP001's giant is not referenced, keeping the mystery.
  scene_continuity: The jar moves desk -> window sill (SC9), consistent with SC11 where the attic window is lit.
  visual_quality: Signature frames - storm in a jar (SC1), giant eye beyond the glass (SC3), nightlight lighthouse (SC5), calm tiny sun (SC8), pull-back (SC11).
  animation_feasibility: Two sets plus a macro jar set; the pull-back is the most complex shot and is flagged for stitching.
  pacing: Hook 3s, problem by 11.5s, failure 16s, attempts to 32s, calm 37s, twist last 9.5s.
  sound_sync: Filter-switch rule distinguishes inside vs outside; breath fog in SC7 and SC11 share the same breath SFX.
  strong_opening: Lightning in a jar lighting a dark bedroom.
  memorable_ending: Milo's room is itself in a jar, and someone breathes on it.
