edit:
  grade: Night scenes in indigo with strong amber practicals; SC8-10 transition to a soft pink-gold dawn; SC11 a dreamlike blend of indigo and pink.
  mix_notes: The clock tick builds tension in SC6-7 - keep it audible but under the creaks; remove it completely on the landing.
  notes:
    - SC2, SC4, SC7 interiors tilt - if the generated clip is level, apply a gentle 3-5 degree rotation in the edit.
    - SC10 to SC11 ZOOM THROUGH - push into her spectacle reflection and cut inside it at the peak.
    - Keep the rolls in SC11 clearly readable as bread (cross-cut tops) - that is the joke.

qc:
  character_consistency: Rosa is the only named character; spectacles, pencil bun and flour on cheeks in every shot.
  story_originality: Flying-building-as-scale mechanic plus the stars-are-bread twist; unique in the slate.
  scene_continuity: Interior (SKY variant) and exterior (FLOATING/NIGHT) alternate logically; the thrown rolls in SC6 pay off in SC11.
  visual_quality: Signature frames - lift-off (SC1), near-miss over rooftops (SC5), ballast toss (SC6), bread constellations (SC11).
  animation_feasibility: One hero, two main sets; tilts can be done in the edit.
  pacing: Hook 3s; problem at 7.5s; escalation to 26.5s; resolution 36s; twist last 5s.
  sound_sync: Each toss has a rise 'bwip'; the clock tick accelerates to SC7 and stops at balance.
  strong_opening: A building lifting off on glowing dough in frame 1.
  memorable_ending: The stars are bread rolls.
