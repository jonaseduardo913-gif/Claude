edit:
  grade: Deep indigo night throughout with a hot white-gold daylight seam; the seam is the brightest element until it closes in SC9, after which the frame goes calm silver-blue.
  mix_notes: Keep the fabric-rip SFX identical every time so it becomes a motif.
  notes:
    - SC8 is a vertical ascent - use a continuous upward track; stitch two clips if needed.
    - SC10 dissolve to SC11 over 12 frames as Pip floats down.
    - Final shot - hold on the synchronized blink, cut on the downbeat.

qc:
  character_consistency: Pip's checked scarf visible in every shot; the button is carried on his back from SC5 onward; the Moon never moves, only changes expression.
  story_originality: Sky-as-a-coat with a missing button; unique conflict.
  scene_continuity: The seam widens SC1 -> SC3 -> SC7 and closes in SC9; climb route goes pond -> heron -> windmill -> spire -> sky, all from BG_008/BG_007.
  visual_quality: Signature frames - sky tear (SC1), heron catapult (SC4), slingshot (SC7), sewing the sky (SC9), twin moons (SC11).
  animation_feasibility: One small hero, simple obstacle animals; sky effects are 2D overlays.
  pacing: Clear escalation ladder, each obstacle 4-5s; payoff at 37s.
  sound_sync: Every hop on a pizzicato pluck; every stitch on a harp note.
  strong_opening: The sky ripping open in frame 1.
  memorable_ending: Pip gets his own little moon nightlight.
