id: EP005
concept: CON005
title: The Moon's Missing Button
format: SHORT
category: Fantasy adventures
logline: When a silver button pops off the night sky, a tiny frog must climb all the way up to sew it back on before daylight spills through.
palette: {dominant: "velvet indigo #1B1F4B and moon silver #D8DDE6", accent: "frog green #6DBE45"}

music:
  id: MUS_EP005
  title: Silver Button Nocturne
  style: A delicate nocturne for celesta and harp with a bouncy oboe theme for Pip; cello tremolo for the tearing sky; an ascending adventure build; a lullaby ending.
  bpm: 100
  key: A-flat major
  instrumentation: [celesta, harp, oboe, pizzicato strings, cello tremolo, french horn, glockenspiel, soft timpani]
  rules: Every Pip hop gets a pizzicato pluck in key; the sky tear always uses the same cello tremolo + fabric rip.

scenes:
  - n: 1
    beat: HOOK
    dur: 3.0
    action: The night sky is a velvet coat. With a loud 'pop', one big silver button snaps off and a seam rips open across the sky, letting a stripe of bright daylight spill through.
    chars: [CHR_025]
    bg: BG_008@TORN_SKY
    props: [PRP_006]
    fx: [FX_001]
    shot: Wide upward shot of the night sky above the millpond, the moon on the left, a row of silver buttons along a stitched seam
    key: A silver button flying off the indigo velvet sky with its thread snapping; a glowing seam of daylight opening behind it; the moon asleep.
    lighting: Deep indigo night, a bright warm white stripe of daylight leaking through the seam
    motion: The button strains, the thread snaps, the button spins away; the seam unzips a little, daylight spilling through; the sleeping moon frowns slightly.
    camera: Quick tilt following the falling button
    expressions: {CHR_025: asleep, a small worried frown}
    sfx: [[0.0, "thread straining creak"], [0.5, "big button POP"], [0.9, "fabric rip"], [1.4, "cello tremolo rumble"], [2.2, "spinning button whistle"]]
    music: Cello tremolo under the rip.
    transition: CUT

  - n: 2
    beat: LANDING
    dur: 4.5
    action: The glowing button falls through the night and plops into the millpond right next to Pip's lily pad, splashing the little frog completely.
    chars: [CHR_024]
    bg: BG_008@NIGHT
    props: [PRP_006]
    fx: [FX_007]
    shot: Medium-wide shot of the millpond, Pip on a lily pad in the foreground, the button falling from above
    key: Pip on a lily pad with eyes wide looking up as a glowing silver button streaks down; reeds and the windmill behind.
    lighting: Silver moonlight on the water, the button's glow lighting Pip from above
    motion: The glowing button streaks down and plops into the water next to Pip; a splash crown soaks Pip, who blinks and spits a little water.
    camera: Static, slight shake on the splash
    expressions: {CHR_024: curious, then startled and dripping}
    sfx: [[0.0, "falling whistle"], [1.6, "big plop splash"], [2.4, "water drips"], [3.2, "little frog spit 'ptoo'"]]
    music: Pizzicato plink as the oboe theme for Pip begins.
    transition: CUT

  - n: 3
    beat: THE PROBLEM
    dur: 4.0
    action: Pip dives in and surfaces carrying the huge glowing button like a shield. He looks up - the seam in the sky is widening, and daylight is pouring through. The sleeping moon looks worried.
    chars: [CHR_024, CHR_025]
    bg: BG_008@TORN_SKY
    props: [PRP_006]
    shot: Low angle from the water's surface, Pip holding the button, the torn sky high above
    key: Pip popping out of the water holding the dinner-plate-sized glowing button over his head; above, the bright seam in the sky spreading wider.
    lighting: Night with a growing stripe of daylight, the button glowing
    motion: Pip dives, splashes back up hoisting the button; he looks up; the seam rips a little more; a startled owl on a reed blinks at the daylight.
    camera: Tilt up from Pip to the sky
    expressions: {CHR_024: determined, CHR_025: worried frown in its sleep}
    sfx: [[0.0, "dive bloop"], [1.2, "surface splash"], [2.4, "fabric rip"], [3.0, "confused owl hoot"]]
    music: Horn call - the adventure begins.
    transition: CUT

  - n: 4
    beat: HERON LIFT
    dur: 4.5
    action: Pip hops onto the beak of a dozing heron. The heron startles awake and snaps its neck up, launching Pip high into the air toward the windmill.
    chars: [CHR_024, CHR_026]
    bg: BG_008@NIGHT
    props: [PRP_006]
    fx: [FX_005]
    shot: Side shot of the heron standing asleep in the reeds, Pip on the tip of its beak
    key: Pip balancing on the long yellow beak of the sleeping heron with the button on his back; the windmill in the background.
    lighting: Moonlight, rim light on the heron
    motion: Pip hops on the beak; the heron opens one eye, startles, and snaps its neck up like a catapult; Pip flies up in an arc out of frame.
    camera: Static, then a fast tilt up following Pip
    expressions: {CHR_024: eager, then surprised mid-flight, CHR_026: dozing, then startled and grumpy}
    sfx: [[0.0, "pizzicato hop"], [1.0, "heron snore whistle"], [2.0, "startled heron squawk"], [2.4, "catapult 'thwoing'"], [3.0, "whoosh of Pip flying"]]
    music: Pizzicato builds into a run.
    transition: CUT

  - n: 5
    beat: WINDMILL
    dur: 5.0
    action: Pip lands on a turning windmill blade and clings with sticky toes. The blade carries him up and around to the very top.
    chars: [CHR_024]
    bg: BG_008@NIGHT
    props: [PRP_006]
    shot: Medium shot of the windmill blades turning, Pip clinging to one
    key: Pip stuck flat to a turning wooden windmill blade with the button strapped on his back like a shell; the pond far below.
    lighting: Moonlight with the daylight seam glowing in the sky behind
    motion: Pip slaps onto the blade; it carries him around in a big arc; at the top he peels off his sticky toes one at a time and climbs onto the windmill cap.
    camera: Rotates slightly with the blade
    expressions: {CHR_024: straining effort, cheeks puffed}
    sfx: [[0.0, "sticky splat landing"], [0.8, "creaking windmill rotation"], [3.4, "sticky toe peel 'thwip thwip thwip'"]]
    music: Rising string scale.
    transition: CUT

  - n: 6
    beat: SPIRE LEAP
    dur: 4.5
    action: Pip makes a huge leap from the windmill to the church spire. He nearly misses, slipping down the stone, but his sticky toes catch at the last second.
    chars: [CHR_024]
    bg: BG_007@NIGHT
    props: [PRP_006]
    fx: [FX_005, FX_011]
    shot: Wide shot of the gap between the windmill top and the church spire against the night sky
    key: Pip mid-leap between the windmill and the spire, legs stretched long, the button glowing on his back.
    lighting: Night sky with the bright seam above
    motion: Pip crouches and leaps with a huge stretch; lands on the spire, slides down a little with a squeak, then one sticky toe holds; he pulls himself up.
    camera: Follows the leap in an arc
    expressions: {CHR_024: determined, then panicked slip, then relieved}
    sfx: [[0.0, "spring launch 'boing'"], [1.6, "landing slap"], [2.0, "sliding squeak on stone"], [3.0, "single sticky 'thwick' hold"], [3.6, "relieved exhale"]]
    music: Timpani roll, cut on the catch.
    transition: CUT

  - n: 7
    beat: SLINGSHOT
    dur: 4.0
    action: At the top of the spire the sky is still too far. The seam rips wider. Pip spots a spider-web strand between two spire points, stretches it into a slingshot and loads himself.
    chars: [CHR_024]
    bg: BG_007@NIGHT
    props: [PRP_006, PRP_007]
    shot: Close-up at the spire tip, Pip pulling back a glistening web strand like a slingshot
    key: Pip leaning far back holding the silver web strand stretched between two stone points, button on his back, the torn sky above.
    lighting: Night, the daylight seam reflecting on the web
    motion: The seam rips wider; Pip looks around, sees the web, plucks it (it twangs), then pulls it back, stretching himself low, aiming at the sky.
    camera: Low angle, slow push-in
    expressions: {CHR_024: thinking, then fiercely determined}
    sfx: [[0.0, "fabric rip"], [1.2, "web strand pluck 'twang'"], [2.2, "stretching creak"], [3.4, "taut silence, a heartbeat"]]
    music: Strings hold a tense high note.
    transition: CUT

  - n: 8
    beat: FLIGHT
    dur: 5.0
    action: Pip shoots up into the sky like a rocket, through the clouds, all the way to the velvet sky, and grabs the edge of the seam.
    chars: [CHR_024, CHR_025]
    bg: BG_007@NIGHT
    props: [PRP_006]
    fx: [FX_005, FX_004]
    shot: Vertical tracking shot following Pip shooting upward through clouds toward the indigo velvet sky
    key: Pip rocketing upward with legs streamlined, button on his back, punching through a cloud; the velvet sky and the glowing seam getting close above.
    lighting: Moonlight in the clouds, increasing glow from the seam
    motion: Pip launches, flies straight up through a cloud bank, slows at the top, and grabs the fabric edge of the seam with both hands.
    camera: Fast vertical track up, decelerating
    expressions: {CHR_024: exhilarated, CHR_025: still asleep}
    sfx: [[0.0, "slingshot release 'THWANG'"], [0.6, "rocketing whoosh"], [2.0, "cloud puff"], [3.8, "velvet grab 'fwump'"]]
    music: Full orchestral ascent, horn theme, peaking at the grab.
    transition: CUT

  - n: 9
    beat: SEWING
    dur: 5.0
    action: Hanging from the sky, Pip sews the button back on with a thorn needle and spider silk. Stitch by stitch, the seam closes and the daylight is sealed away.
    chars: [CHR_024, CHR_025]
    bg: BG_007@NIGHT
    props: [PRP_006, PRP_007]
    fx: [FX_001]
    shot: Close-up on the velvet sky fabric, Pip stitching the silver button in place
    key: Pip pushing a thorn needle with shimmering silver silk through the indigo velvet, the button half sewn on, the seam stitched halfway with the daylight stripe shrinking.
    lighting: Silver sparkle along each stitch, the daylight stripe shrinking
    motion: Pip stitches in fast rhythmic loops, each stitch sparkling; the seam zips shut from both ends; the last stitch, a knot, a bite to cut the thread.
    camera: Slow push-in
    expressions: {CHR_024: concentrated, tongue out}
    sfx: [[0.0, "needle 'thip' through velvet"], [0.6, "thip"], [1.2, "thip"], [1.8, "sparkle zip of the seam closing"], [3.6, "tiny thread snip with teeth"]]
    music: Harp arpeggios, one per stitch, resolving.
    transition: CUT

  - n: 10
    beat: GRATITUDE
    dur: 4.0
    action: The Moon wakes, sees Pip, and smiles. It gives him a tiny glowing button-moon. Pip floats down to earth holding it like a parachute.
    chars: [CHR_024, CHR_025]
    bg: BG_007@NIGHT
    fx: [FX_004]
    shot: Medium two-shot of the big glowing Moon face and tiny Pip hanging from the sky beside it
    key: The Moon with open kind eyes and a smile; a tiny glowing marble-sized button-moon floating into Pip's hands.
    lighting: Soft silver moonglow on Pip
    motion: The Moon opens its eyes slowly and smiles; a tiny glowing button floats from the Moon to Pip; Pip grabs it, lets go of the sky, and drifts gently down as if under a parachute.
    camera: Slow pull-back as Pip descends
    expressions: {CHR_025: grateful smile, slow wink, CHR_024: amazed, then delighted}
    sfx: [[0.0, "soft celestial hum"], [1.2, "twinkle"], [2.0, "gentle wink 'ting'"], [2.8, "airy floating whoosh"]]
    music: Celesta lullaby begins.
    transition: DISSOLVE

  - n: 11
    beat: TWIST
    dur: 5.0
    action: Back on his lily pad, Pip's tiny button-moon floats above him as his own little nightlight. He curls up to sleep beneath it, and the big Moon and the little moon blink at the same moment.
    chars: [CHR_024, CHR_025]
    bg: BG_008@NIGHT
    fx: [FX_004]
    shot: Wide shot of the millpond, Pip on his lily pad with the tiny glowing moon above him in the foreground, the big Moon in the sky behind
    key: Pip curled up asleep on his lily pad under a tiny glowing button-moon; the big Moon in the sky above; both reflected in the still water.
    lighting: Silver moonlight doubled by the tiny moon's glow
    motion: Pip yawns and curls up; the tiny moon bobs above him; the big Moon and the tiny moon blink in sync; reflections ripple gently.
    camera: Slow push-in, then hold
    expressions: {CHR_024: blissful, sleepy smile, CHR_025: gentle sleepy smile}
    sfx: [[0.0, "frog yawn"], [1.4, "night crickets"], [3.2, "double soft twinkle in sync"]]
    music: Lullaby resolves on A-flat major at the cut.
    transition: CUT TO END CARD

