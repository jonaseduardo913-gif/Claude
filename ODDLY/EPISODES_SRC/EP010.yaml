edit:
  grade: Night scenes lavender-blue with warm nightlight; morning scenes bright yellow sunlight; SC5 strobes between the two.
  mix_notes: Keep the minuet/drums contrast clear; the finale duet should be balanced.
  notes:
    - SC1 opens in near-darkness; the eyes must be visible on frame 1.
    - SC3 to SC4 dissolve over 12 frames from night to morning.
    - SC5 time-lapse - alternate night/day every 12 frames; if generated as one clip, add the light strobe in grading.
    - SC7 hold the frozen stare for at least 36 frames; the silence is the gag.

qc:
  character_consistency: Milo in PAJAMAS throughout (it is always bedtime or just after waking); Fuzzle's apron and pink-tipped horns in every shot; the duster loses feathers in SC5 and is shown whole again in SC10 as a sign of joy (acceptable stylization, noted for the art team).
  story_originality: Monster-under-the-bed inverted into a neat freak; the gift-of-mess resolution is unique.
  scene_continuity: Uses the same bedroom set as EP009 (shared world); MESSY and TIDY variants mark state; the toy brick from SC6 is part of the gift pile in SC9.
  visual_quality: Signature frames - duster reveal (SC1), horror face (SC2), ballet cleaning (SC3), silent agony (SC6), mutual freeze (SC7), sock crane (SC11).
  animation_feasibility: One set, two characters; the time-lapse can be done in the edit.
  pacing: Hook 3s, premise by 11.5s, escalation to 24.5s, confrontation 28.5s, resolution 37.5s, twist last 5s.
  sound_sync: Minuet = order and drums = mess motif carries the story; silence for the caught moment.
  strong_opening: A monster hand reaching out from under the bed holding a feather duster.
  memorable_ending: A sock crane comes to life and perches on Milo's cowlick.
