id: EP001
concept: CON024
title: The Giant's Contact Lens
format: SHORT
category: Unexpected encounters
logline: Thistledown goes skating on a perfect round lake that appeared overnight — until the giant who lost it comes looking.
palette: {dominant: "sky blue #8FC8E8 and meadow green #7DBA5A", accent: "beard orange #E07A2E"}

music:
  id: MUS_EP001
  title: Lens Waltz
  style: Playful orchestral skating waltz in 3/4 that turns into a heavy comic march when the giant appears, then back to a warm waltz.
  bpm: 138 (waltz), 92 (giant march)
  key: D major -> D minor (giant) -> D major
  instrumentation: [glockenspiel, pizzicato strings, flute, clarinet, accordion, tuba, bass drum, timpani, celesta]
  rules: Every Bramblefoot footstep lands on a tuba + bass-drum downbeat.

scenes:
  - n: 1
    beat: HOOK
    dur: 3.0
    action: Top-down on a perfectly round, slightly domed, crystal-clear 'lake' in a dawn meadow. June skates a fast figure-eight across it; under her blades the surface wobbles like jelly.
    chars: [CHR_002]
    bg: BG_002@DAWN
    props: [PRP_001, PRP_002]
    fx: [FX_001]
    shot: Straight top-down aerial, the round lens fills 80% of the frame like a giant glass eye, June small in the center
    key: June mid-glide on one skate, arms out, scarf-like raincoat flaring; a ring of grass and daisies around the clear disc; sky reflected in it.
    lighting: Pale dawn light, silver mist, bright specular highlight on the domed surface
    motion: June carves a quick figure-eight leaving sparkling scratch-lines; at the crossing point the whole disc wobbles like jelly in two springy pulses, then settles.
    camera: Slow clockwise rotation of the top-down view (20 degrees)
    expressions: {CHR_002: big gap-toothed grin, eyes closed in joy}
    sfx: [[0.0, "crisp skate-blade swish left"], [0.8, "skate-blade swish right"], [1.6, "rubbery 'boing-oing' wobble of the surface"], [2.4, "tiny glass sparkle chime"]]
    music: Waltz starts instantly on beat one, glockenspiel melody.
    transition: CUT

  - n: 2
    beat: SETUP
    dur: 4.5
    action: Villagers stream in from the village with old leather skates. The red-haired twins slide on their bellies; the old man with the cane tests the surface with a tap, then wobbles off gracefully.
    chars: [CHR_002, CHR_007]
    bg: BG_002@DAWN
    props: [PRP_001, PRP_002]
    fx: [FX_005]
    shot: Wide eye-level shot across the meadow, the round glassy lake in the middle ground, the village and windmill on the horizon
    key: Villagers mid-skate in a loose circle; twins sliding on bellies with scarves flying; old man balancing on one leg with cane raised; June leading in front.
    lighting: Warm sunrise breaking from the left, long soft shadows, mist burning off
    motion: Looping skate cycles for the crowd; twins slide across the frame left to right; old man taps the surface twice with his cane, wobbles, then glides away doing a perfect pirouette.
    camera: Gentle lateral dolly right following the twins
    expressions: {CHR_002: confident grin, CHR_007: cheerful laughing faces; old man surprised then delighted}
    sfx: [[0.0, "chorus of skate swishes"], [1.2, "two hollow glassy 'tink tink' cane taps"], [2.0, "comic slide whistle down as old man wobbles"], [3.2, "graceful harp gliss on the pirouette"]]
    music: Accordion joins; waltz full and bouncy.
    transition: CUT

  - n: 3
    beat: WONDER
    dur: 4.0
    action: June lies on her belly and presses her face to the clear surface. Below, a ladybug crawling on the grass is magnified to look huge. June gasps and grins.
    chars: [CHR_002]
    bg: BG_002@DAWN
    props: [PRP_001]
    fx: [FX_001]
    shot: Close-up from below the lens looking up at June's face pressed to the glass, a giant magnified ladybug in the foreground
    key: June's cheeks squashed flat on the curved clear surface, eyes huge; a magnified ladybug walking past her nose on the grass side.
    lighting: Soft caustic light patterns dancing over her face
    motion: Ladybug strolls across; June's eyes follow it, she pulls back, blows a fog patch on the surface and draws a quick smiley in it with a fingertip.
    camera: Static, slight push-in
    expressions: {CHR_002: squished-face astonishment turning into a delighted grin}
    sfx: [[0.0, "soft squeak of cheek on glass"], [1.0, "tiny clicky ladybug footsteps magnified"], [2.4, "breath 'hhhaaa' fogging"], [3.0, "finger squeak drawing on glass"]]
    music: Music thins to celesta and flute only.
    transition: CUT

  - n: 4
    beat: THREAT
    dur: 4.5
    action: The ground trembles. Skates rattle, a puddle ripples in rings, and a flock of birds bursts out of the forest edge. Everyone freezes mid-skate.
    chars: [CHR_002, CHR_007]
    bg: BG_002@DAWN
    props: [PRP_001]
    fx: [FX_003]
    shot: Low-angle ground-level shot of a puddle with skates in the foreground, frozen skaters and the forest behind
    key: Puddle with concentric rings; a skate blade vibrating; behind, villagers frozen in odd poses; birds exploding from the tree line.
    lighting: Sun goes behind a cloud; cooler light
    motion: Three heavy tremors spaced evenly - puddle rings, pebbles hop, skaters bob with each one; on the third, birds burst out of the trees.
    camera: Camera shakes on each tremor, then a slow tilt up from puddle to treeline
    expressions: {CHR_002: alarmed wide eyes, CHR_007: frozen mid-pose, startled}
    sfx: [[0.0, "deep distant THOOM"], [1.4, "closer THOOM with pebble rattle"], [2.8, "huge THOOM, skate blades rattling"], [3.2, "flock of birds flapping away"]]
    music: Waltz stops dead; low timpani hits match each THOOM.
    transition: CUT

  - n: 5
    beat: REVEAL
    dur: 5.0
    action: Over the hill crawls Bramblefoot the giant on hands and knees, squinting hard with his right eye, patting the ground blindly. He accidentally pats a cow on the head and flattens a fence.
    chars: [CHR_020]
    bg: BG_002@DAWN
    fx: [FX_002]
    shot: Wide low-angle shot, the giant rising over the hill fills the top two-thirds of the frame, tiny meadow and fence in foreground
    key: Bramblefoot on all fours, enormous squinting face, one huge hand patting a confused cow; fence planks springing up; bird nests in his beard.
    lighting: Back-lit by the rising sun, warm rim light around his beard
    motion: Giant crawls forward heavily; his palm pats the cow twice (cow blinks), then his other hand flattens a fence which springs back up crooked.
    camera: Slow tilt up from fence to giant's face
    expressions: {CHR_020: squinting lost and worried, nose wrinkled}
    sfx: [[0.0, "tuba + bass drum step"], [1.2, "giant hand pat 'fwump fwump'"], [2.0, "bewildered cow 'moo'"], [3.2, "wooden fence crunch and spring 'boing'"], [4.2, "giant's long confused 'hmmmm' hum, low cello (no words)"]]
    music: Comic giant march in D minor, tuba on footsteps.
    transition: CUT

  - n: 6
    beat: PANIC
    dur: 4.0
    action: Villagers scatter in panic as a giant hand sweeps over the meadow toward the lake. Fingertips stop inches above the surface, then move away.
    chars: [CHR_007, CHR_020]
    bg: BG_002@DAWN
    props: [PRP_001]
    fx: [FX_005, FX_002]
    shot: High-angle wide, huge fingers entering from top of frame over the tiny fleeing skaters
    key: Giant fingers like a ceiling descending; villagers running in all directions; hats flying off.
    lighting: Giant hand casts a big cool shadow over the meadow
    motion: Hand sweeps slowly in an arc; panic-run cycles; a straw hat lifts off in the wind of the hand and spins away.
    camera: Slight downward drift with the hand
    expressions: {CHR_007: panicked, mouths open in silent screams, CHR_020: unseen face}
    sfx: [[0.0, "huge whoosh of air"], [0.6, "comic panic scramble footsteps"], [1.5, "hat flutter whirl"], [2.8, "fingers swish away overhead"]]
    music: Frantic pizzicato runs over the march.
    transition: CUT

  - n: 7
    beat: REALIZATION
    dur: 4.5
    action: June stays put. She looks up at the giant's blurry squinting right eye, then down at the round clear lake under her skates, then back up. She understands.
    chars: [CHR_002, CHR_020]
    bg: BG_002@DAWN
    props: [PRP_001]
    fx: [FX_001]
    shot: Split vertical composition, June in the lower half on the lens, the giant's huge squinting eye in the upper half
    key: June looking up; her eyes reflect the giant eye; the lens under her catches a sky-blue glint matching the giant's clear left eye.
    lighting: A sunbeam hits the lens and flashes
    motion: June's head turns up, down, up in three snappy beats; on the last beat a sparkle zips around the lens rim and her eyes widen.
    camera: Quick vertical tilts matching her head turns, ending on a push-in on June
    expressions: {CHR_002: thinking, then eyebrows shoot up in realization, CHR_020: blurry squint}
    sfx: [[0.0, "woodblock tick (look up)"], [0.8, "woodblock tock (look down)"], [1.6, "woodblock tick (look up)"], [2.4, "bright glass 'ting' + sparkle sweep"]]
    music: Clarinet 'idea' motif, three rising notes.
    transition: WHIP PAN

  - n: 8
    beat: TEAMWORK
    dur: 5.5
    action: June waves the villagers back. Together they lift the giant lens over their heads like a huge glass dish and stagger across the meadow toward the giant.
    chars: [CHR_002, CHR_007]
    bg: BG_002@DAWN
    props: [PRP_001]
    fx: [FX_011]
    shot: Low frontal shot, the lens held overhead like a glass roof, villagers' legs wobbling underneath, June at the front pointing the way
    key: Twelve villagers under the clear disc, legs bowed with effort; June in front pointing forward; sky visible through the lens.
    lighting: Bright morning sun, the lens throws a rainbow caustic on the grass
    motion: Group shuffles forward in a staggering march, swaying left and right; the disc flexes and wobbles; twins nearly drop their edge and recover.
    camera: Steady push backward (dolly out) keeping pace with the group
    expressions: {CHR_002: determined, CHR_007: straining, cheeks puffed}
    sfx: [[0.0, "group effort grunts (non-verbal)"], [1.0, "wobbling glass 'wub-wub'"], [2.6, "near-drop slide whistle down"], [3.2, "recovery slide whistle up"], [4.4, "marching footsteps in rhythm"]]
    music: Waltz returns as a heroic march-waltz, brass enters.
    transition: CUT

  - n: 9
    beat: RETURN
    dur: 4.5
    action: Bramblefoot gently lifts June and the villagers on his palm to his face. They push the lens up; with his fingertip he pops it into his right eye. A huge blink.
    chars: [CHR_002, CHR_007, CHR_020]
    bg: BG_002@DAWN
    props: [PRP_001]
    shot: Extreme close-up of the giant's right eye filling the frame, tiny villagers on his fingertip lifting the lens toward it
    key: Giant eye with orange eyelashes like reeds; tiny June on the tip of his finger guiding the clear lens onto the eye.
    lighting: Warm skin light, the lens shining
    motion: Lens slides onto the eye with a soft suction; giant eyelid blinks slowly top to bottom like a curtain; villagers duck the eyelashes.
    camera: Slow push-in to the eye
    expressions: {CHR_002: concentrated, tongue out, CHR_007: holding breath, CHR_020: holding very still, then blinking}
    sfx: [[0.0, "soft effort squeak"], [1.6, "wet gentle 'thwup' as lens lands"], [2.6, "enormous slow eyelid 'whoosh-blink'"], [3.6, "villagers' tiny gasp"]]
    music: Strings hold a suspended chord.
    transition: CUT

  - n: 10
    beat: FOCUS
    dur: 4.0
    action: Giant's point of view - a blurry smear snaps into sharp focus, showing tiny villagers waving from his palm. He gasps gently at how small they are and holds perfectly still.
    chars: [CHR_002, CHR_007]
    bg: BG_002@DAY
    shot: Giant POV close on his own palm with the village crowd, background meadow far below
    key: Tiny villagers on a huge palm with creases like valleys, waving; June in front with both arms up.
    lighting: Bright clear day
    motion: Image starts fully blurred, racks into crisp focus in one smooth pull; villagers wave; the palm trembles slightly as the giant tries not to move.
    camera: Rack focus from blur to sharp, tiny trembling handheld drift
    expressions: {CHR_002: laughing, waving, CHR_007: cheering}
    sfx: [[0.0, "underwater muffled ambience"], [1.0, "sharp 'focus' shimmer zip, ambience snaps clear"], [2.0, "tiny distant cheers"], [3.0, "giant's soft astonished intake of breath, low and airy"]]
    music: Waltz theme returns, gentle and warm on strings.
    transition: CUT

  - n: 11
    beat: TWIST
    dur: 5.0
    action: To be extra careful, Bramblefoot pulls enormous round brass glasses from his overalls pocket and puts them on over the lens. Birds pop out of his beard nests; the villagers cheer; the whole village is reflected in his glasses.
    chars: [CHR_002, CHR_007, "CHR_020:GLASSES"]
    bg: BG_002@DAY
    fx: [FX_012, FX_001]
    shot: Medium close-up of the giant's beaming face wearing the brass glasses, villagers small on his palm in the lower foreground
    key: Giant with huge round glasses, eyes magnified and sparkling, wide shy smile; two baby birds peeking from his beard; the village reflected in each lens; June giving a double thumbs-up.
    lighting: Golden morning glow, sparkles on the glass
    motion: Glasses slide on with a final nose push; his magnified eyes blink twice; baby birds pop up and chirp; villagers throw hats; sparkle glints run across both lenses.
    camera: Slow pull-back to reveal glasses, then hold
    expressions: {CHR_020: shy overjoyed smile, CHR_002: double thumbs-up grin, CHR_007: cheering}
    sfx: [[0.0, "glasses unfold 'click-clack'"], [1.0, "nose-push 'boop'"], [1.8, "two magnified blinks 'bloink bloink'"], [2.6, "baby birds chirp"], [3.4, "crowd cheer and hats whoosh"], [4.4, "double sparkle glint"]]
    music: Full waltz finale, cymbal swell, final D major chord exactly at the cut.
    transition: CUT TO END CARD

thumbnail:
  cover_frame: EP001_SC01 at 1.6s (June at the crossing point of the figure-eight)
  chars: [CHR_002, CHR_020]
  bg: BG_002@DAWN
  prompt: Top half - Bramblefoot's giant squinting face peeking over the hill; bottom half - June skating on a huge round glass contact lens in the meadow, the giant's blurry eye and the clear lens aligned vertically.
  overlay: "IT'S NOT A LAKE"

